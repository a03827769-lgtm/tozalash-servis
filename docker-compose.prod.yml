version: '3.8'

services:
  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: tozalash_bot_prod
    restart: always
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - db
      - redis
    networks:
      - tozalash_net

  db:
    image: mysql:8.0
    container_name: tozalash_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-tozalash_db}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tozalash_net

  redis:
    image: redis:alpine
    container_name: tozalash_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tozalash_net

volumes:
  db_data:
  redis_data:

networks:
  tozalash_net:
    driver: bridge
