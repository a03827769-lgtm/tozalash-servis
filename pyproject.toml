[project]
name = "tozalash-servis"
version = "2.0.0"
description = "Tozalash Servis - AI Automation System (Enterprise Edition)"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot==20.7",
    "pyrogram==2.0.106",
    "tgcrypto==1.2.5",
    "google-generativeai",
    "pydantic==2.6.1",
    "g4f",
    "curl_cffi",
    "nest_asyncio",
    "torch",
    "TTS",
    "edge-tts",
    "pydub",
    "SpeechRecognition",
    "emoji",
    "fastapi==0.109.2",
    "uvicorn==0.27.1",
    "websockets",
    "PyJWT==2.8.0",
    "aiomysql==0.2.0",
    "PyMySQL==1.1.0",
    "aiosqlite==0.20.0",
    "httpx~=0.25.2",
    "requests==2.31.0",
    "aiohttp==3.9.3",
    "APScheduler==3.10.4",
    "gspread==6.0.2",
    "google-auth==2.27.0",
    "google-auth-oauthlib==1.2.0",
    "google-api-python-client==2.116.0",
    "pandas==2.2.0",
    "matplotlib==3.8.3",
    "orjson==3.9.13",
    "reportlab",
    "python-dotenv==1.0.1",
    "python-dateutil==2.8.2",
    "pytz==2024.1",
    "loguru==0.7.2",
    "Pillow==10.2.0",
    "asyncio-throttle==1.0.2",
    "langdetect==1.0.9",
    "cryptography==42.0.5",
    "beautifulsoup4==4.12.3",
    "lxml==5.1.0",
    "sentry-sdk",
    "tenacity==8.2.3",
    "chromadb==0.4.22",
    "ollama==0.1.6",
    "prometheus-fastapi-instrumentator",
    "fastapi-cache2",
    "slowapi",
    "pydantic-settings>=2.0.0",
    "alembic==1.13.1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
