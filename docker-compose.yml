version: '3.8'

# Enterprise Production Docker Compose Configuration
# PostgreSQL 16 + Redis 7 + FastAPI API + Next.js Admin + Prometheus + Grafana + Nginx

services:
  # Primary Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: tozalash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-tozalash_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tozalash_password}
      POSTGRES_DB: ${DB_DATABASE:-tozalash_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tozalash_user} -d ${DB_DATABASE:-tozalash_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tozalash_network

  # Cache & Event Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: tozalash_redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: /bin/sh -c 'if [ -z "$$REDIS_PASSWORD" ]; then redis-server --appendonly yes; else redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes; fi'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tozalash_network

  # Backend API (FastAPI + Telegram Bot Supervisor)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tozalash_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-tozalash_user}
      - DB_PASSWORD=${DB_PASSWORD:-tozalash_password}
      - DB_DATABASE=${DB_DATABASE:-tozalash_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - WS_AUTH_TOKEN=${WS_AUTH_TOKEN}
      - SENTRY_DSN=${SENTRY_DSN:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - tozalash_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend Admin Panel (Next.js 14)
  admin_panel:
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
    container_name: tozalash_admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    depends_on:
      - api
    networks:
      - tozalash_network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tozalash_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - tozalash_network

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: tozalash_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - tozalash_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tozalash_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
      - admin_panel
      - grafana
    networks:
      - tozalash_network

  # Certbot for Let's Encrypt SSL
  certbot:
    image: certbot/certbot
    container_name: tozalash_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - tozalash_network

volumes:
  pg_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  tozalash_network:
    driver: bridge
